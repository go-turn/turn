// turnd's API. Served by a plain grpc.Server, over a WebSocket for browsers
// (github.com/grpc-transports/websocket). Only /login, /callback and /healthz
// are HTTP: an OIDC redirect cannot be an RPC.
//
// Authentication is gRPC metadata, never a URL or a message field:
//
//	authorization: Bearer <token>
//
// where the token is a turnd session token or an issuer access token
// (Credentials, CreateRoom), or a room peer token (everything else).
//
// Status codes: UNAUTHENTICATED (no or bad token), PERMISSION_DENIED (the
// token may not do this: a pending guest, a guest deciding), NOT_FOUND (no such
// room or peer, or a dead token's room), INVALID_ARGUMENT (malformed),
// ALREADY_EXISTS (a second stream for one peer), FAILED_PRECONDITION (already
// admitted), RESOURCE_EXHAUSTED (a bound: message size, queue, guests, pending,
// rooms per subject, credential requests), UNAVAILABLE (the server is full).
syntax = "proto3";

package turn.v1;

option go_package = "github.com/go-turn/turn/proto/turn/v1;turnv1";

service Turnd {
  // Credentials mints TURN credentials for a logged-in person.
  rpc Credentials(CredentialsRequest) returns (IceServers);

  // RenewSession trades a session token for a fresh one without another login.
  // Bearer: a session token still valid or expired for less than the grace
  // period (5 minutes by default). turnd keeps the identity provider's refresh
  // token server side and spends it here; the answer carries a new session token
  // and its expiry. UNAUTHENTICATED ends the matter: the token cannot be renewed
  // (it predates renewal, its family is unknown or over, it expired beyond the
  // grace, or the provider refused: the account or its session was revoked), so
  // the person must sign in again. UNAVAILABLE means the provider could not be
  // reached: the session is intact, retry. UNIMPLEMENTED: renewal is off.
  rpc RenewSession(RenewSessionRequest) returns (RenewSessionResponse);

  // CreateRoom opens a room as its host (session token).
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);

  // JoinRoom knocks at a room with its ID (no token). The guest is PENDING: it
  // may open the Room stream and receive, nothing else, until the host admits it.
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);

  // Admit lets a pending guest in; Deny refuses one (or removes an admitted
  // one): its token is dead. Host token only.
  rpc Admit(DecideRequest) returns (Ack);
  rpc Deny(DecideRequest) returns (Ack);

  // RoomCredentials gives an ADMITTED peer TURN credentials that expire with the
  // room, charged to the host's subject.
  rpc RoomCredentials(RoomRef) returns (IceServers);

  // CloseRoom ends the room (host token only).
  rpc CloseRoom(RoomRef) returns (Ack);

  // HandOver gives the host role to an admitted guest that is connected (host
  // token only): NOT_FOUND (no such peer), FAILED_PRECONDITION (the guest is
  // still pending), INVALID_ARGUMENT (the host itself), PERMISSION_DENIED (the
  // caller is not the host). The old host's token is dead afterwards: it comes
  // back with Reclaim, as an ordinary guest. Every peer gets sys.host-changed.
  rpc HandOver(HandOverRequest) returns (Ack);

  // AppointCoHost gives an ADMITTED guest the right to Admit, Deny, CloseRoom and
  // get RoomCredentials charged to itself (when it presented a session) beside
  // the host; RevokeCoHost takes it back at once. Host token only: a co-host
  // cannot appoint or revoke, nor hand over. There is still exactly one active
  // host. FAILED_PRECONDITION: pending, already (or not) a co-host; NOT_FOUND:
  // no such peer (a denied one included); INVALID_ARGUMENT: the host itself.
  // Everyone gets sys.cohost-added / sys.cohost-removed {"peer":"<id>"}. On a
  // host loss past the grace period the earliest-appointed co-host still
  // connected is promoted first, then the earliest-admitted guest.
  rpc AppointCoHost(CoHostRequest) returns (Ack);
  rpc RevokeCoHost(CoHostRequest) returns (Ack);

  // Reclaim is how a person who was the host comes back. Bearer: a SESSION token
  // (never a room token) whose subject is the host's. While the host role is
  // still theirs (the grace period, or a stale stream still open) they take it
  // back with a NEW host token and nothing changes for the others. After a
  // handover the same call returns a guest token for the SAME peer ID: the person
  // is an admitted guest of the new host (it is told with sys.join), no knock.
  // PERMISSION_DENIED: the subject was never the host of this room.
  rpc Reclaim(ReclaimRequest) returns (ReclaimResponse);

  // Room is the room's one bidirectional stream. Metadata: authorization (the
  // peer token) and x-turn-room (the room ID). The server sends every event for
  // the peer, system events included; the peer sends messages, routed host to
  // guest and guest to host (never guest to guest). A pending guest may not send.
  // Ending the stream (either side cancelling or half-closing) means leaving:
  // a guest leaves; the host's leaving starts the grace period (turnd
  // --host-grace, 2 minutes), after which a guest is promoted (see HandOver and
  // Reclaim), or the room closes when none can be. A host that reopens the
  // stream with its own token within the grace period is the host still.
  rpc Room(stream Envelope) returns (stream Envelope);
}

message CredentialsRequest {}

message RenewSessionRequest {}

message RenewSessionResponse {
  string token = 1; // the new session token
  int64 expires = 2; // Unix seconds
}

message CreateRoomRequest {
  // max_guests is how many guests this room admits AT ONCE (a leaving guest
  // frees its place). 0: the default, 8 (or the server's ceiling if lower).
  // Above the server's --max-guests (the ceiling) or negative: INVALID_ARGUMENT.
  int32 max_guests = 1;
}

message CreateRoomResponse {
  string room = 1; // 128 random bits, 32 hex characters
  string peer = 2; // the creator's peer ID, ordinary ("g1"); no peer is ever named "host"
  string token = 3;
  int64 expires = 4; // Unix seconds
  int32 max_guests = 5; // the room's cap on guests admitted at once
}

message JoinRoomRequest {
  string room = 1;
  string name = 2; // display name: at most 64 characters, no control characters
}

message JoinRoomResponse {
  string room = 1;
  string peer = 2;
  string host = 3; // the host's peer ID
  string token = 4;
  int64 expires = 5;
  bool pending = 6; // always true: wait for sys.admitted
}

message DecideRequest {
  string room = 1;
  string peer = 2;
}

message RoomRef {
  string room = 1;
}

message HandOverRequest {
  string room = 1;
  string to = 2; // the peer ID of an admitted, connected guest
}

message CoHostRequest {
  string room = 1;
  string peer = 2;
}

message ReclaimRequest {
  string room = 1;
}

message ReclaimResponse {
  string room = 1;
  string peer = 2; // the SAME peer ID as before
  bool host = 3; // true: the person is the host again; false: an admitted guest
  string host_peer = 4; // the current host's peer ID
  string token = 5; // a new peer token; the old one is dead
  int64 expires = 6; // the room's, never extended
}

message Ack {}

// IceServers is shaped like an RTCConfiguration's iceServers list.
message IceServers {
  repeated IceServer ice_servers = 1;
  int32 ttl = 2; // seconds
}

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

// Envelope is a message or an event. Kinds starting "sys." are the server's:
//
//	sys.knock    to the host: from is a waiting guest, body its display name
//	sys.join     to the host: from is a guest that was admitted
//	sys.leave    to the host: from is a guest that left (body "expired" if its wait ran out)
//	sys.admitted to a guest: the host let it in
//	sys.denied   to a guest: refused, removed, or its wait expired; the token is dead
//	sys.closed   to everyone: the room is over (the stream then ends)
//	sys.host-changed to everyone, the old host included: body {"from":"<peer>","to":"<peer>"},
//	             the host role moved; peer IDs do not change. The new host is also
//	             told the pending guests (sys.knock) and the admitted ones (sys.join)
//	             again, and gets the messages that were queued for the old host.
//	             "host" as a message's to is an ALIAS for the CURRENT host, the same
//	             for every sender (the host using it is told sys.error InvalidArgument);
//	             "from" and every event name real peer IDs, never "host"
//	sys.cohost-added / sys.cohost-removed to everyone: body {"peer":"<peer>"}; the
//	             knocks, joins and leaves go to the host and every co-host
//	sys.error    to the sender of a message the OTHER peer could not take (gone,
//	             queue full): body "<Code>: <reason>" with the gRPC code's name,
//	             e.g. "NotFound: no such peer"; the stream stays open
//
// A message that breaks the protocol (body over the limit, a "from" that is not
// the sender, a bad kind, a pending sender, guest to guest) instead ENDS the
// sender's stream with a status: RESOURCE_EXHAUSTED, PERMISSION_DENIED,
// INVALID_ARGUMENT. Ending a stream is leaving, so for a guest that kills its
// token and for the host it closes the room.
message Envelope {
  uint64 seq = 1; // set by the server on events
  string from = 2; // must be the sender's own peer ID on messages
  string to = 3;
  string kind = 4; // [a-z0-9._-], at most 32 characters, never "sys."
  bytes body = 5;
}

<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="go-turn">
  <defs>
    <linearGradient id="goturn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#goturn)"/>
  <!-- A relay: two peers that cannot reach each other, and the ring between them that passes the traffic on. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="128" r="32"/>
    <path d="M72 128 H 96"/>
    <path d="M160 128 H 184"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="56" cy="128" r="15"/>
    <circle cx="200" cy="128" r="15"/>
    <circle cx="128" cy="128" r="9"/>
  </g>
</svg>
